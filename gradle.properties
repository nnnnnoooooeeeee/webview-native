# Kept small so the build also works on an 8 GB machine with other programs open
# (VS Code, browsers). This app is tiny, so 1 GB of heap is plenty.
# Metaspace is only a ceiling (used as needed): the builder app's tests plus its
# R8 release build in one daemon need more than 384 MB, or Kotlin compilation fails.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of starting a second JVM for it.
kotlin.compiler.execution.strategy=in-process

# The app from apps/ that a plain Gradle run builds (e.g. Run in Android Studio).
# build-apk.bat and GitHub Actions pass their own: -PappFolder=<folder>
appFolder=google

# Placeholder values of the template APK (app/, build type "template"). The
# Android builder app (builder/) finds and replaces them on the phone.
templateAppName=WebView Template App
templateApplicationId=com.webview.template
templateVersionName=0.0.0-template
templateUrl=https://template.invalid/
